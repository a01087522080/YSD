<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>모바일 미리보기</title>
  <style>
    body { margin: 0; background: #222; display: flex; gap: 24px; padding: 20px; font-family: sans-serif; }
    figure { margin: 0; }
    figcaption { color: #ddd; font-size: 12px; margin-bottom: 6px; }
    iframe { border: 0; background: #fff; display: block; }
  </style>
</head>
<body>
  <figure>
    <figcaption>iPhone 14 (390 x 844)</figcaption>
    <iframe src="./index.html" width="390" height="844"></iframe>
  </figure>
  <figure>
    <figcaption>iPhone SE (360 x 740)</figcaption>
    <iframe src="./index.html" width="360" height="740"></iframe>
  </figure>
</body>
</html>
